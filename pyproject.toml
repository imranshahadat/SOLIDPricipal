[project]
name = "learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "imranshahadat", email = "imranali.13imran@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
]

[project.scripts]
learning = "learning:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/W: pycodestyle, F: Pyflakes, I: isort (imports), ANN: flake8-annotations, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "ANN", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["learning"]
